<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <style type="text/css">
    @page { size: A4; margin: 18mm 16mm; }
    body {
      font-family: 'Noto Sans', 'Noto Sans Thai', sans-serif;
      font-size: 10pt;
      color: #1a1a1a;
      line-height: 1.4;
    }
    h1 {
      font-size: 16pt;
      margin: 0 0 4px 0;
    }
    .subtitle {
      font-size: 10pt;
      color: #555;
      margin: 0 0 16px 0;
    }
    .meta-table, .lines, .totals {
      width: 100%;
      border-collapse: collapse;
    }
    .meta-table td {
      vertical-align: top;
      width: 50%;
      padding: 0 8px 12px 0;
    }
    .label {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
      margin: 0 0 2px 0;
    }
    .value {
      margin: 0 0 8px 0;
    }
    .lines th, .lines td {
      border-bottom: 1px solid #ddd;
      padding: 6px 4px;
      text-align: left;
    }
    .lines th {
      font-size: 8pt;
      text-transform: uppercase;
      color: #666;
    }
    .lines td.num, .lines th.num, .totals td.num {
      text-align: right;
    }
    .totals {
      margin-top: 12px;
      width: 45%;
      margin-left: auto;
    }
    .totals td {
      padding: 4px 0;
    }
    .totals .grand td {
      font-weight: bold;
      font-size: 11pt;
      border-top: 1px solid #1a1a1a;
      padding-top: 8px;
    }
    .footer {
      margin-top: 28px;
      font-size: 8pt;
      color: #777;
    }
  </style>
</head>
<body>
__BODY__
</body>
</html>
