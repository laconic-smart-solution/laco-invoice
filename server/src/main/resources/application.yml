spring:
  application:
    name: lacoinvoice
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        type:
          preferred_boolean_jdbc_type: TINYINT
        query:
          passDistinctThrough: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m,recordStats
  quartz:
    job-store-type: memory
    auto-startup: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8091

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

lacoinvoice:
  logging:
    enabled: true
    request-id-header: X-Request-Id
    slow-request-threshold-ms: 3000
    exclude-paths:
      - /actuator

app:
  cors:
    enabled: true
    allow-credentials: true
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    exposed-headers: Authorization,X-Request-Id
  auth:
    cookies:
      access-name: laco_invoice_access_token
      refresh-name: laco_invoice_refresh_token
      secure: true
      same-site: Lax
      path: /
      refresh-path: /api/v1/auth
  security:
    mode: oauth2
    jwks:
      insecure-ssl: false
  sso:
    insecure-ssl: false
  users:
    default-admin:
      enabled: true
      email: admin@gmail.com
      full-name: Admin Laconic
      username: admin
      auth-server-user-id: ${DEFAULT_ADMIN_AUTH_SERVER_USER_ID:}
      role: ADMIN
  sync:
    quartz:
      enabled: false
      cron: "0 */10 * * * ?"
      timezone: Asia/Bangkok
  order-import:
    preview-cleanup:
      quartz:
        # Hard-deletes order_import_batches + preview_orders/items only (keeps order_import_files).
        enabled: false
        cron: "0 15 3 * * ?"
        timezone: Asia/Bangkok
        retention-days: 7
  order-input:
    ai-auto-choose:
      default-admin-enabled: false
  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  erp:
    enabled: ${USE_ERP_API:false}
    base-url: ${ERP_API_BASE_URL:}
    token: ${ERP_API_TOKEN:}
    posted-by: ${ERP_POSTED_BY:LACO-INVOICE}
    insecure-ssl: ${ERP_INSECURE_SSL:false}
  marketplace-product-sync:
    list-chunk-size: 50
    detail-chunk-size: 10
    detail-request-delay-ms: 300
  communication:
    # Point at lazada-service directly (:8084) with empty base paths, OR at Spring Cloud
    # Gateway (:8080) with /comms/{marketplace} prefixes (gateway rewrites them away).
    gateway-url: ${COMMUNICATION_GATEWAY_URL:http://localhost:8084}
    lazada-base-path: ${COMMUNICATION_LAZADA_BASE_PATH:}
    shopee-base-path: ${COMMUNICATION_SHOPEE_BASE_PATH:}
    tiktok-base-path: ${COMMUNICATION_TIKTOK_BASE_PATH:}
    gateway-secret: ${GATEWAY_SECRET:hello}
    lazada-app-key: ${LAZADA_APP_KEY:}
    lazada-app-secret: ${LAZADA_APP_SECRET:}
    tiktok-app-key: ${TIKTOK_APP_KEY:}
    tiktok-app-secret: ${TIKTOK_APP_SECRET:}
    tiktok-shop-scraping: ${TIKTOK_SHOP_SCRAPPING:false}
    tiktok-scrape-url: ${TIKTOK_SCRAPE_URL:http://localhost:8090}

sso:
  url: ${SSO_URL:https://api-auths.laconic.co.th}
  signup:
    url: ${SSO_SIGNUP_URL:https://api-auths.laconic.co.th/v1/lcn-sso/auth/sign-up}
  application-code: ${SSO_APPLICATION_CODE:laco-invoice}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${SSO_JWKS_URL:https://api-auths.laconic.co.th/v1/lcn-sso/auth/jwks.json}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
