spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//113.53.62.172:1200/LACONIC}
    username: ${DB_USERNAME:LACO_INVOICE}
    password: ${DB_PASSWORD:LACO_INVOICE}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:192.168.0.242}
      password: ${REDIS_PASSWORD:Hello@test123}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  security:
    jwks:
      insecure-ssl: ${JWKS_INSECURE_SSL:true}
  sso:
    insecure-ssl: ${SSO_INSECURE_SSL:true}
  users:
    default-admin:
      auth-server-user-id: ${DEFAULT_ADMIN_AUTH_SERVER_USER_ID:f14b9e92-0acf-42d3-9a85-cabc7d994c93}
