spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origin-patterns: 
  order-input:
    ai-auto-choose:
      default-admin-enabled: true
  openai:
    api-key: ${OPENAI_API_KEY:}
  auth:
    cookies:
      secure: false
  security:
    jwks:
      insecure-ssl: ${JWKS_INSECURE_SSL:true}
  sso:
    insecure-ssl: ${SSO_INSECURE_SSL:true}
  users:
    default-admin:
      auth-server-user-id: ${DEFAULT_ADMIN_AUTH_SERVER_USER_ID:}
  # Marketplace Open Platform credentials (caller-owned; forwarded as vendor headers)
  communication:
    gateway-url: ${COMMUNICATION_GATEWAY_URL:}
    # Empty when calling marketplace services directly. Set /comms/lazada etc. only if
    # gateway-url points at Spring Cloud Gateway (:8080).
    lazada-base-path: ${COMMUNICATION_LAZADA_BASE_PATH:}
    shopee-base-path: ${COMMUNICATION_SHOPEE_BASE_PATH:}
    tiktok-base-path: ${COMMUNICATION_TIKTOK_BASE_PATH:}
    lazada-app-key: ${LAZADA_APP_KEY:139411}
    lazada-app-secret: ${LAZADA_APP_SECRET:}
    # Set real Partner Center values (or env) before connecting TikTok Shop
    tiktok-app-key: ${TIKTOK_APP_KEY:}
    tiktok-app-secret: ${TIKTOK_APP_SECRET:}
    # Temporary: true → tiktok-shop-scrape (Playwright); false → Partner tiktok-service
    tiktok-shop-scraping: ${TIKTOK_SHOP_SCRAPPING:false}
    tiktok-scrape-url: ${TIKTOK_SCRAPE_URL:http://localhost:8090}
  erp:
    enabled: ${USE_ERP_API:false}
    base-url: ${ERP_API_BASE_URL:}
    token: ${ERP_API_TOKEN:}
    posted-by: ${ERP_POSTED_BY:LACO-INVOICE}
    insecure-ssl: ${ERP_INSECURE_SSL:true}
